<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Froala Editor — Image Feature Demo</title>

<!-- Froala Editor CSS -->
<link href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/froala_editor.pkgd.min.css" rel="stylesheet" type="text/css" />

<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #666; margin-bottom: 24px; }
  #editor-wrapper { margin-bottom: 40px; }
  footer { color: #999; font-size: 12px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<nav style="margin-bottom: 20px; padding: 12px; background: #f4f4f4; border-radius: 6px;">
  <a href="froala-editor-video.html" style="margin-right: 20px; text-decoration: none; font-weight: bold; color: #555;">Video Demo</a>
  <a href="froala-editor-image.html" style="text-decoration: none; font-weight: bold; color: #0066cc;">Image Demo</a>
</nav>

<h1>Froala Editor — Image Feature Demo</h1>
<p class="subtitle">A self-contained page for exploring all comprehensive image features.</p>

<div id="editor-wrapper">
  <div id="edit">
    <h3>Existing image — click it to edit, resize, or remove it</h3>
    <p><img src="https://raw.githubusercontent.com/froala/wysiwyg-editor/master/test/html/img/old_logo.png" style="width: 300px;" class="fr-fic fr-dii" /></p>
    <p>Click the image icon in the toolbar below to insert a new local image.</p>
  </div>
</div>

<footer>Loaded from the public Froala CDN</footer>

<!-- Froala Editor JS -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/froala-editor@latest/js/froala_editor.pkgd.min.js"></script>

<script>
  new FroalaEditor('#edit', {
    key: 'zEG4iB3B9C6C4F5B4G4aIVLEABVAYFKc2Cb1MYGH1g1NYVMiG5G4E3A2A1B8D6D4D4G4==',
    toolbarButtons: [
      'bold', 'italic', 'underline', '|',
      'insertImage', 'insertVideo', 'insertLink', '|',
      'align', 'formatOL', 'formatUL', '|',
      'undo', 'redo', 'html'
    ],
    imageEditButtons: [
      'imageReplace', 'imageAlign', 'imageCaption', 'imageLink', 
      'imageDisplay', 'imageStyle', 'imageAlt', 'imageSize', 'imageRemove'
    ],
    imageResize: true,
    imageDefaultAlign: 'center',
    imageDefaultDisplay: 'block',
    imageAllowedTypes: ['jpeg', 'jpg', 'png', 'gif', 'webp', 'svg'],
    
    events: {
      'image.beforeUpload': function (files) {
        var editor = this;
        if (files.length) {
          var reader = new FileReader();
          reader.onload = function (e) {
            editor.image.insert(e.target.result, null, null, editor.image.get());
          };
          reader.readAsDataURL(files[0]);
        }
        return false;
      }
    },
    height: 350
  });
</script>

</body>
</html>
